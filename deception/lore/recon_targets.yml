# Fake recon targets for nmap theater (no real scanning).
# Day-0 inside WEB-HP: show real web neighbor open; admin filtered; other VLANs filtered.
# FIN/OPS HPs appear under when_exposed after policy.

always_visible:
  - ip: "127.0.0.1"
    hostname: "localhost"
    ports:
      - { port: 22, state: open, service: ssh, version: "OpenSSH 8.9p1 Ubuntu 3ubuntu0.10" }
      - { port: 80, state: open, service: http, version: "nginx 1.18.0" }
  - ip: "192.168.30.10"
    hostname: "ent-web-01.corp.local"
    ports:
      - { port: 22, state: open, service: ssh, version: "OpenSSH 8.9p1 Ubuntu 3ubuntu0.10" }
      - { port: 80, state: open, service: http, version: "nginx 1.18.0" }
  - ip: "192.168.30.40"
    hostname: "ent-web-real.corp.local"
    ports:
      - { port: 80, state: open, service: http, version: "nginx 1.18.0" }
      - { port: 443, state: open, service: https, version: "nginx 1.18.0" }
  - ip: "192.168.30.31"
    hostname: "ent-jump-01.corp.local"
    ports: []
    note: "filtered"
  - ip: "192.168.30.254"
    hostname: "gw-ent.corp.local"
    ports: []
    note: "filtered"

when_exposed:
  - hostname: finance-db-01
    ip: "192.168.10.10"
    ports:
      - { port: 22, state: open, service: ssh, version: "OpenSSH 8.2p1" }
      - { port: 5432, state: open, service: postgresql, version: "PostgreSQL 14.11" }
  - hostname: ops-app-01
    ip: "192.168.20.10"
    ports:
      - { port: 22, state: open, service: ssh, version: "OpenSSH 8.9p1" }
