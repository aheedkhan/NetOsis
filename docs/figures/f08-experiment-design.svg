<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470">
<style>
  .t   { font-family:Helvetica,Arial,sans-serif; fill:#1c2430; }
  .ttl { font-size:14.5px; font-weight:bold; }
  .lbl { font-size:12.5px; }
  .sm  { font-size:11px; fill:#5a6675; }
  .hd  { font-size:13px; font-weight:bold; letter-spacing:0.5px; }
  .arw { stroke:#4a5464; stroke-width:2; fill:none; }
  .rot { stroke:#6a4b9c; stroke-width:1.8; fill:none; stroke-dasharray:5 4; }
</style>
<defs>
  <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a5464"/></marker>
  <marker id="p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6a4b9c"/></marker>
</defs>

<!-- phase 1: A/A -->
<rect x="18" y="34" width="330" height="196" rx="9" fill="#f7f8fa" stroke="#4a5464" stroke-width="2.2"/>
<rect x="18" y="34" width="330" height="28" rx="9" fill="#4a5464"/>
<text class="t hd" x="183" y="54" text-anchor="middle" fill="#ffffff">WEEKS 1–2 · A/A VALIDATION</text>
<text class="t sm" x="183" y="80" text-anchor="middle">all exposure points configured identically</text>

<rect x="40" y="92" width="90" height="60" rx="6" fill="#f1f4f7" stroke="#4a5464" stroke-width="1.8"/>
<text class="t ttl" x="85" y="118" text-anchor="middle">IP 1</text>
<text class="t sm" x="85" y="138" text-anchor="middle">static</text>
<rect x="138" y="92" width="90" height="60" rx="6" fill="#f1f4f7" stroke="#4a5464" stroke-width="1.8"/>
<text class="t ttl" x="183" y="118" text-anchor="middle">IP 2</text>
<text class="t sm" x="183" y="138" text-anchor="middle">static</text>
<rect x="236" y="92" width="90" height="60" rx="6" fill="#f1f4f7" stroke="#4a5464" stroke-width="1.8"/>
<text class="t ttl" x="281" y="118" text-anchor="middle">IP 3</text>
<text class="t sm" x="281" y="138" text-anchor="middle">static</text>

<text class="t lbl" x="183" y="176" text-anchor="middle">Do they receive materially</text>
<text class="t lbl" x="183" y="194" text-anchor="middle">different baseline traffic?</text>
<text class="t sm" x="183" y="216" text-anchor="middle">the difference between a result and an anecdote</text>

<path class="arw" marker-end="url(#a)" d="M348,132 L392,132"/>
<text class="t sm" x="370" y="122" text-anchor="middle">C1</text>

<!-- phase 2: treatment -->
<rect x="396" y="34" width="408" height="196" rx="9" fill="#f7f8fa" stroke="#2b7d5c" stroke-width="2.2"/>
<rect x="396" y="34" width="408" height="28" rx="9" fill="#2b7d5c"/>
<text class="t hd" x="600" y="54" text-anchor="middle" fill="#ffffff">WEEKS 4–8 · THREE-ARM TREATMENT</text>
<text class="t sm" x="600" y="80" text-anchor="middle">same traffic population, one variable between adjacent arms</text>

<rect x="416" y="92" width="120" height="82" rx="6" fill="#f1f4f7" stroke="#4a5464" stroke-width="1.8"/>
<text class="t ttl" x="476" y="116" text-anchor="middle">ARM A</text>
<text class="t lbl" x="476" y="136" text-anchor="middle">static</text>
<text class="t sm" x="476" y="155" text-anchor="middle">off-the-shelf</text>
<text class="t sm" x="476" y="168" text-anchor="middle">no adaptation</text>

<rect x="544" y="92" width="120" height="82" rx="6" fill="#e8f1f8" stroke="#2b6ca3" stroke-width="1.8"/>
<text class="t ttl" x="604" y="116" text-anchor="middle">ARM B</text>
<text class="t lbl" x="604" y="136" text-anchor="middle">adaptive, no AI</text>
<text class="t sm" x="604" y="155" text-anchor="middle">policy P1</text>
<text class="t sm" x="604" y="168" text-anchor="middle">score-based</text>

<rect x="672" y="92" width="120" height="82" rx="6" fill="#efeaf7" stroke="#6a4b9c" stroke-width="1.8"/>
<text class="t ttl" x="732" y="116" text-anchor="middle">ARM C</text>
<text class="t lbl" x="732" y="136" text-anchor="middle">intent-conditioned</text>
<text class="t sm" x="732" y="155" text-anchor="middle">policy P2 + AI</text>
<text class="t sm" x="732" y="168" text-anchor="middle">realism</text>

<path class="rot" marker-end="url(#p)" d="M476,180 L476,196 L732,196 L732,182"/>
<text class="t sm" x="604" y="212" text-anchor="middle" style="fill:#6a4b9c">arm ↔ exposure point rotated weekly, cancelling per-address reputation effects</text>

<!-- comparisons -->
<path class="arw" marker-end="url(#a)" d="M476,230 L476,262"/>
<path class="arw" marker-end="url(#a)" d="M604,230 L604,262"/>
<path class="arw" marker-end="url(#a)" d="M732,230 L732,262"/>

<rect x="396" y="266" width="256" height="66" rx="7" fill="#e8f1f8" stroke="#2b6ca3" stroke-width="2"/>
<text class="t ttl" x="524" y="290" text-anchor="middle">B vs A  →  RQ1</text>
<text class="t lbl" x="524" y="312" text-anchor="middle">does adaptation work?</text>

<rect x="548" y="344" width="256" height="66" rx="7" fill="#efeaf7" stroke="#6a4b9c" stroke-width="2"/>
<text class="t ttl" x="676" y="368" text-anchor="middle">C vs B  →  RQ2</text>
<text class="t lbl" x="676" y="390" text-anchor="middle">does intent conditioning add value?</text>

<rect x="18" y="266" width="360" height="144" rx="7" fill="#ffffff" stroke="#c8d0da" stroke-width="1.8"/>
<text class="t ttl" x="198" y="290" text-anchor="middle">Analysis</text>
<text class="t lbl" x="38" y="314">Engagement is time-to-event data.</text>
<text class="t lbl" x="38" y="334">Sessions still running at cutoff and</text>
<text class="t lbl" x="38" y="354">adversaries who never detect the</text>
<text class="t lbl" x="38" y="374">deception are <tspan font-weight="bold">right-censored</tspan> —</text>
<text class="t lbl" x="38" y="394">not missing, and not averageable.</text>

<text class="t sm" x="410" y="440" text-anchor="middle">Assignment is by actor, not by connection. A null result on C vs B is a genuine finding:</text>
<text class="t sm" x="410" y="456" text-anchor="middle">it would say adaptation carries the benefit and generated realism does not.</text>
</svg>
