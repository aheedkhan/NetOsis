<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500">
<style>
  .t   { font-family:Helvetica,Arial,sans-serif; fill:#1c2430; }
  .ttl { font-size:15.5px; font-weight:bold; letter-spacing:0.3px; }
  .lbl { font-size:13px; }
  .sm  { font-size:11.5px; fill:#5a6675; }
  .arw { stroke:#4a5464; stroke-width:2.2; fill:none; }
</style>
<defs>
  <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a5464"/></marker>
</defs>

<rect x="330" y="14" width="160" height="40" rx="7" fill="#fbeaea" stroke="#a83232" stroke-width="2"/>
<text class="t ttl" x="410" y="40" text-anchor="middle" style="fill:#a83232">ADVERSARY</text>

<path class="arw" d="M410,54 L410,74"/>
<path class="arw" marker-end="url(#a)" d="M410,74 L190,74 L190,102"/>
<path class="arw" marker-end="url(#a)" d="M410,74 L630,74 L630,102"/>

<!-- host / session -->
<rect x="45" y="106" width="290" height="188" rx="8" fill="#fbf0e3" stroke="#b4661f" stroke-width="2.2"/>
<text class="t ttl" x="190" y="132" text-anchor="middle" style="fill:#b4661f">HOST / SESSION</text>
<text class="t sm" x="190" y="150" text-anchor="middle">what they type — moderatable</text>
<line x1="70" y1="160" x2="310" y2="160" stroke="#e0c4a2" stroke-width="1.4"/>
<text class="t lbl" x="70" y="182">authentication attempts</text>
<text class="t lbl" x="70" y="204">commands issued</text>
<text class="t lbl" x="70" y="226">files accessed</text>
<text class="t lbl" x="70" y="248">processes spawned</text>
<text class="t lbl" x="70" y="270">privilege attempts</text>

<!-- network -->
<rect x="485" y="106" width="290" height="188" rx="8" fill="#e8f1f8" stroke="#2b6ca3" stroke-width="2.2"/>
<text class="t ttl" x="630" y="132" text-anchor="middle" style="fill:#2b6ca3">NETWORK</text>
<text class="t sm" x="630" y="150" text-anchor="middle">what their tooling does — far less so</text>
<line x1="510" y1="160" x2="750" y2="160" stroke="#b8cddd" stroke-width="1.4"/>
<text class="t lbl" x="510" y="182">DNS queries</text>
<text class="t lbl" x="510" y="204">destination IP and port</text>
<text class="t lbl" x="510" y="226">TLS and HTTP metadata</text>
<text class="t lbl" x="510" y="248">bytes and timing</text>
<text class="t lbl" x="510" y="270">IDS alerts · policy denials</text>

<path class="arw" d="M190,294 L190,318 L410,318"/>
<path class="arw" d="M630,294 L630,318 L410,318"/>
<path class="arw" marker-end="url(#a)" d="M410,318 L410,344"/>

<rect x="240" y="348" width="340" height="60" rx="8" fill="#efeaf7" stroke="#6a4b9c" stroke-width="2.4"/>
<text class="t ttl" x="410" y="374" text-anchor="middle" style="fill:#6a4b9c">BEHAVIOUR ENGINE</text>
<text class="t sm" x="410" y="395" text-anchor="middle">correlation across both streams</text>

<path class="arw" d="M410,408 L410,426"/>
<path class="arw" marker-end="url(#a)" d="M410,426 L230,426 L230,448"/>
<path class="arw" marker-end="url(#a)" d="M410,426 L590,426 L590,448"/>

<rect x="90" y="452" width="280" height="38" rx="7" fill="#f1f4f7" stroke="#4a5464" stroke-width="1.8"/>
<text class="t ttl" x="230" y="470" text-anchor="middle">INTENT</text>
<text class="t sm" x="230" y="484" text-anchor="middle">reconnaissance · persistence · exfiltration</text>

<rect x="450" y="452" width="280" height="38" rx="7" fill="#f1f4f7" stroke="#4a5464" stroke-width="1.8"/>
<text class="t ttl" x="590" y="470" text-anchor="middle">CAPABILITY</text>
<text class="t sm" x="590" y="484" text-anchor="middle">tool download · C2 attempt · lateral movement</text>
</svg>
