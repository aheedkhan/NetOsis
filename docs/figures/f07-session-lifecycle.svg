<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440">
<style>
  .t   { font-family:Helvetica,Arial,sans-serif; fill:#1c2430; }
  .ttl { font-size:15px; font-weight:bold; }
  .lbl { font-size:12px; }
  .sm  { font-size:11px; fill:#5a6675; }
  .ed  { font-size:11px; fill:#4a5464; }
  .arw { stroke:#4a5464; stroke-width:2.2; fill:none; }
  .burn{ stroke:#a83232; stroke-width:2; fill:none; stroke-dasharray:6 4; }
</style>
<defs>
  <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a5464"/></marker>
  <marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#a83232"/></marker>
</defs>

<!-- levels row -->
<rect x="20" y="120" width="170" height="94" rx="8" fill="#f1f4f7" stroke="#4a5464" stroke-width="2"/>
<text class="t ttl" x="105" y="146" text-anchor="middle">L0 · OBSERVE</text>
<text class="t lbl" x="105" y="168" text-anchor="middle">sensing only</text>
<text class="t sm" x="105" y="188" text-anchor="middle">an unremarkable host</text>
<text class="t sm" x="105" y="203" text-anchor="middle">gives nothing away</text>

<rect x="216" y="120" width="170" height="94" rx="8" fill="#e8f1f8" stroke="#2b6ca3" stroke-width="2"/>
<text class="t ttl" x="301" y="146" text-anchor="middle">L1 · ATTRACT</text>
<text class="t lbl" x="301" y="168" text-anchor="middle">surfaces exposed</text>
<text class="t sm" x="301" y="188" text-anchor="middle">authentication refused</text>
<text class="t sm" x="301" y="203" text-anchor="middle">credentials captured</text>

<rect x="412" y="120" width="170" height="94" rx="8" fill="#fbf0e3" stroke="#b4661f" stroke-width="2.4"/>
<text class="t ttl" x="497" y="146" text-anchor="middle">L2 · ENGAGE</text>
<text class="t lbl" x="497" y="168" text-anchor="middle">authentication succeeds</text>
<text class="t sm" x="497" y="188" text-anchor="middle">restricted real shell</text>
<text class="t sm" x="497" y="203" text-anchor="middle">populated filesystem</text>

<rect x="608" y="120" width="170" height="94" rx="8" fill="#f3eef8" stroke="#6a4b9c" stroke-width="2" stroke-dasharray="6 4"/>
<text class="t ttl" x="693" y="146" text-anchor="middle">L3 · IMMERSE</text>
<text class="t lbl" x="693" y="168" text-anchor="middle">internal network</text>
<text class="t sm" x="693" y="188" text-anchor="middle">credential material</text>
<text class="t sm" x="693" y="203" text-anchor="middle">designed — built at P6</text>

<path class="arw" marker-end="url(#a)" d="M190,167 L210,167"/>
<path class="arw" marker-end="url(#a)" d="M386,167 L406,167"/>
<path class="arw" marker-end="url(#a)" d="M582,167 L602,167"/>

<text class="t ed" x="200" y="110" text-anchor="middle">intent</text>
<text class="t ed" x="200" y="98" text-anchor="middle">emerges</text>
<text class="t ed" x="396" y="110" text-anchor="middle">objective</text>
<text class="t ed" x="396" y="98" text-anchor="middle">inferred</text>
<text class="t ed" x="592" y="110" text-anchor="middle">novelty</text>
<text class="t ed" x="592" y="98" text-anchor="middle">still high</text>

<!-- header note -->
<rect x="20" y="20" width="758" height="52" rx="7" fill="#f7f8fa" stroke="#c8d0da" stroke-width="1.6"/>
<text class="t lbl" x="399" y="42" text-anchor="middle">Escalation is not monotonic. Levels describe how much reality is granted;</text>
<text class="t lbl" x="399" y="61" text-anchor="middle">containment holds as an invariant at every one of them.</text>

<!-- BURN -->
<path class="burn" marker-end="url(#r)" d="M301,214 L301,258 L200,258 L200,290"/>
<path class="burn" marker-end="url(#r)" d="M497,214 L497,258 L260,258"/>
<path class="burn" marker-end="url(#r)" d="M693,236 L693,258 L340,258"/>
<text class="t sm" x="352" y="250" style="fill:#a83232">suspicion rises — expected value of further escalation turns negative</text>

<rect x="60" y="294" width="280" height="80" rx="8" fill="#fbeaea" stroke="#a83232" stroke-width="2.4"/>
<text class="t ttl" x="200" y="320" text-anchor="middle" style="fill:#a83232">BURN</text>
<text class="t lbl" x="200" y="342" text-anchor="middle">stop spending · harvest · disengage</text>
<text class="t sm" x="200" y="362" text-anchor="middle">the technique that succeeded is logged as a</text>

<rect x="450" y="294" width="280" height="80" rx="8" fill="#f1f4f7" stroke="#4a5464" stroke-width="2.4"/>
<text class="t ttl" x="590" y="320" text-anchor="middle">BLOCK</text>
<text class="t lbl" x="590" y="342" text-anchor="middle">safety or abuse response</text>
<text class="t sm" x="590" y="362" text-anchor="middle">circuit breaker · teardown · kill switch</text>

<text class="t sm" x="200" y="392" text-anchor="middle" style="fill:#a83232">defect against the deception surface</text>
<text class="t sm" x="399" y="422" text-anchor="middle">BURN has no analogue in the surveyed literature — every published adaptive honeypot escalates monotonically.</text>
</svg>
