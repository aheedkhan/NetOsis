<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" width="820" height="540">
<style>
  .t   { font-family:Helvetica,Arial,sans-serif; fill:#1c2430; }
  .ttl { font-size:16px; font-weight:bold; letter-spacing:0.3px; }
  .lbl { font-size:13px; }
  .sm  { font-size:11.5px; fill:#5a6675; }
  .warn{ font-size:12.5px; font-weight:bold; fill:#a83232; }
  .arw { stroke:#4a5464; stroke-width:2.4; fill:none; }
  .tap { stroke:#2b6ca3; stroke-width:2; fill:none; stroke-dasharray:6 4; }
</style>
<defs>
  <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a5464"/></marker>
  <marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2b6ca3"/></marker>
</defs>

<rect x="230" y="18" width="240" height="46" rx="7" fill="#fbeaea" stroke="#a83232" stroke-width="2"/>
<text class="t ttl" x="350" y="47" text-anchor="middle" style="fill:#a83232">INTERNET</text>

<path class="arw" marker-end="url(#a)" d="M350,64 L350,96"/>
<text class="t sm" x="362" y="86">the only route</text>

<rect x="150" y="100" width="400" height="132" rx="8" fill="#eef1f5" stroke="#4a5464" stroke-width="2.6"/>
<text class="t ttl" x="350" y="128" text-anchor="middle">EGRESS GATEWAY</text>
<text class="t lbl" x="176" y="153">· nftables — default-DENY allowlist</text>
<text class="t lbl" x="176" y="174">· DNS proxy and sinkhole responder</text>
<text class="t lbl" x="176" y="195">· NAT and connection logging</text>
<text class="t lbl" x="176" y="216">· rate limit · byte cap · circuit breaker</text>

<path class="arw" marker-end="url(#a)" d="M350,232 L350,300"/>

<!-- monitoring tap -->
<path class="tap" marker-end="url(#b)" d="M350,266 L596,266"/>
<rect x="600" y="196" width="205" height="140" rx="8" fill="#e8f1f8" stroke="#2b6ca3" stroke-width="2"/>
<text class="t ttl" x="702" y="224" text-anchor="middle" style="fill:#2b6ca3">MONITORING</text>
<text class="t lbl" x="702" y="248" text-anchor="middle">Zeek · Suricata · pcap</text>
<line x1="620" y1="262" x2="785" y2="262" stroke="#b8cddd" stroke-width="1.5"/>
<text class="t warn" x="702" y="284" text-anchor="middle">passive tap / L2 bridge</text>
<text class="t warn" x="702" y="302" text-anchor="middle">NO IP in deception VLAN</text>
<text class="t sm" x="702" y="322" text-anchor="middle">an inline L3 hop would be</text>
<text class="t sm" x="702" y="332" text-anchor="middle">visible and attackable</text>

<rect x="150" y="304" width="400" height="150" rx="8" fill="#fbf0e3" stroke="#b4661f" stroke-width="2.6"/>
<text class="t ttl" x="350" y="332" text-anchor="middle" style="fill:#b4661f">DECEPTION ZONE</text>
<text class="t lbl" x="176" y="357">· SSH sandbox — real restricted shell</text>
<text class="t lbl" x="176" y="378">· generated filesystem and credentials</text>
<text class="t lbl" x="176" y="399">· session telemetry, exported outward</text>
<text class="t lbl" x="176" y="420">· ephemeral · auto-teardown</text>
<text class="t sm" x="176" y="441">no default route of its own</text>

<rect x="600" y="360" width="205" height="94" rx="8" fill="#ffffff" stroke="#98a4b3" stroke-width="1.8" stroke-dasharray="5 4"/>
<text class="t ttl" x="702" y="386" text-anchor="middle" style="fill:#5a6675">ANALYST SIDE</text>
<text class="t lbl" x="702" y="410" text-anchor="middle">Wireshark over</text>
<text class="t lbl" x="702" y="428" text-anchor="middle">exported captures</text>
<text class="t sm" x="702" y="446" text-anchor="middle">never attacker-side</text>

<rect x="55" y="480" width="710" height="42" rx="6" fill="#f6f0f0" stroke="#a83232" stroke-width="1.6"/>
<text class="t ttl" x="410" y="507" text-anchor="middle" style="fill:#a83232">The attacker may have internet access — but never controls the path to it</text>
</svg>
