<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420">
<style>
  .t   { font-family:Helvetica,Arial,sans-serif; fill:#1c2430; }
  .ttl { font-size:12.5px; font-weight:bold; }
  .lbl { font-size:11.5px; }
  .sm  { font-size:10.5px; fill:#5a6675; }
  .wk  { font-size:11px; font-weight:bold; fill:#5a6675; }
  .bar { font-size:11px; font-weight:bold; fill:#ffffff; }
  .grid{ stroke:#dfe4ea; stroke-width:1; }
</style>

<!-- week header -->
<line class="grid" x1="160" y1="44" x2="799" y2="44" stroke="#98a4b3" stroke-width="1.6"/>
<text class="t wk" x="195" y="36" text-anchor="middle">W0</text>
<text class="t wk" x="266" y="36" text-anchor="middle">W1</text>
<text class="t wk" x="337" y="36" text-anchor="middle">W2</text>
<text class="t wk" x="408" y="36" text-anchor="middle">W3</text>
<text class="t wk" x="479" y="36" text-anchor="middle">W4</text>
<text class="t wk" x="550" y="36" text-anchor="middle">W5</text>
<text class="t wk" x="621" y="36" text-anchor="middle">W6</text>
<text class="t wk" x="692" y="36" text-anchor="middle">W7</text>
<text class="t wk" x="763" y="36" text-anchor="middle">W8</text>

<!-- vertical grid -->
<line class="grid" x1="160" y1="44" x2="160" y2="284"/>
<line class="grid" x1="231" y1="44" x2="231" y2="284"/>
<line class="grid" x1="302" y1="44" x2="302" y2="284"/>
<line class="grid" x1="373" y1="44" x2="373" y2="284"/>
<line class="grid" x1="444" y1="44" x2="444" y2="284"/>
<line class="grid" x1="515" y1="44" x2="515" y2="284"/>
<line class="grid" x1="586" y1="44" x2="586" y2="284"/>
<line class="grid" x1="657" y1="44" x2="657" y2="284"/>
<line class="grid" x1="728" y1="44" x2="728" y2="284"/>
<line class="grid" x1="799" y1="44" x2="799" y2="284"/>

<!-- rows -->
<text class="t ttl" x="12" y="72">P0  Design &amp; approval</text>
<rect x="161" y="56" width="69" height="26" rx="4" fill="#4a5464"/>
<text class="t bar" x="195" y="74" text-anchor="middle">P0</text>

<text class="t ttl" x="12" y="110">P1  Sensing &amp; ground truth</text>
<rect x="232" y="94" width="140" height="26" rx="4" fill="#2b6ca3"/>
<text class="t bar" x="302" y="112" text-anchor="middle">P1 · A/A validation</text>

<text class="t ttl" x="12" y="148">P2  Deception surfaces</text>
<rect x="374" y="132" width="69" height="26" rx="4" fill="#b4661f"/>
<text class="t bar" x="408" y="150" text-anchor="middle">P2</text>

<text class="t ttl" x="12" y="186">P3  Interaction &amp; intent</text>
<rect x="445" y="170" width="69" height="26" rx="4" fill="#6a4b9c"/>
<text class="t bar" x="479" y="188" text-anchor="middle">P3</text>

<text class="t ttl" x="12" y="224">P4  Intelligence</text>
<rect x="516" y="208" width="140" height="26" rx="4" fill="#2b7d5c"/>
<text class="t bar" x="586" y="226" text-anchor="middle">P4</text>

<text class="t ttl" x="12" y="262">P5  Evaluation</text>
<rect x="658" y="246" width="140" height="26" rx="4" fill="#2b7d5c"/>
<text class="t bar" x="728" y="264" text-anchor="middle">P5</text>

<!-- three-arm collection band -->
<rect x="445" y="288" width="353" height="18" rx="4" fill="#efeaf7" stroke="#6a4b9c" stroke-width="1.4"/>
<text class="t sm" x="621" y="301" text-anchor="middle" style="fill:#6a4b9c">three-arm data collection — the only part that cannot be compressed</text>
<rect x="232" y="288" width="212" height="18" rx="4" fill="#e8f1f8" stroke="#2b6ca3" stroke-width="1.4"/>
<text class="t sm" x="338" y="301" text-anchor="middle" style="fill:#2b6ca3">exposure live</text>

<!-- milestones -->
<text class="t ttl" x="12" y="336">Milestones</text>
<g fill="#b4661f">
  <path d="M266,322 l11,-11 l11,11 l-11,11 z" transform="translate(-11,0)"/>
  <path d="M408,322 l11,-11 l11,11 l-11,11 z" transform="translate(-11,0)"/>
  <path d="M479,322 l11,-11 l11,11 l-11,11 z" transform="translate(-11,0)"/>
  <path d="M763,322 l11,-11 l11,11 l-11,11 z" transform="translate(-11,0)"/>
</g>
<text class="t sm" x="266" y="348" text-anchor="middle">M1 first event</text>
<text class="t sm" x="404" y="348" text-anchor="middle">M2 arm B</text>
<text class="t sm" x="483" y="348" text-anchor="middle">M3 arm C</text>
<text class="t sm" x="763" y="348" text-anchor="middle">M4 demo</text>

<!-- checkpoints -->
<text class="t ttl" x="12" y="382">Checkpoints</text>
<g>
  <circle cx="373" cy="376" r="9" fill="#ffffff" stroke="#a83232" stroke-width="2.4"/>
  <text class="t sm" x="373" y="380" text-anchor="middle" style="fill:#a83232;font-weight:bold">1</text>
  <circle cx="444" cy="376" r="9" fill="#ffffff" stroke="#a83232" stroke-width="2.4"/>
  <text class="t sm" x="444" y="380" text-anchor="middle" style="fill:#a83232;font-weight:bold">2</text>
  <circle cx="657" cy="376" r="9" fill="#ffffff" stroke="#a83232" stroke-width="2.4"/>
  <text class="t sm" x="657" y="380" text-anchor="middle" style="fill:#a83232;font-weight:bold">3</text>
</g>
<text class="t sm" x="373" y="402" text-anchor="middle">A/A clean?</text>
<text class="t sm" x="452" y="402" text-anchor="middle">gate passes?</text>
<text class="t sm" x="657" y="402" text-anchor="middle">enough operators?</text>

<text class="t ttl" x="12" y="20">CyberSnare — Milestone 1</text>
</svg>
