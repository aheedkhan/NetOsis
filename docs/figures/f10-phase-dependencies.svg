<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400">
<style>
  .t   { font-family:Helvetica,Arial,sans-serif; fill:#1c2430; }
  .ttl { font-size:14px; font-weight:bold; }
  .lbl { font-size:11.5px; }
  .sm  { font-size:10.5px; fill:#5a6675; }
  .gate{ font-size:11px; font-weight:bold; fill:#a83232; }
  .arw { stroke:#4a5464; stroke-width:2.2; fill:none; }
  .fut { stroke:#98a4b3; stroke-width:2; fill:none; stroke-dasharray:6 4; }
</style>
<defs>
  <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a5464"/></marker>
  <marker id="d" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#98a4b3"/></marker>
</defs>

<!-- milestone-1 chain -->
<rect x="14" y="120" width="112" height="78" rx="7" fill="#f1f4f7" stroke="#4a5464" stroke-width="2"/>
<text class="t ttl" x="70" y="144" text-anchor="middle">P0</text>
<text class="t lbl" x="70" y="163" text-anchor="middle">design &amp;</text>
<text class="t lbl" x="70" y="178" text-anchor="middle">approval</text>
<text class="t sm" x="70" y="192" text-anchor="middle">pre-W1</text>

<rect x="152" y="120" width="112" height="78" rx="7" fill="#e8f1f8" stroke="#2b6ca3" stroke-width="2"/>
<text class="t ttl" x="208" y="144" text-anchor="middle">P1</text>
<text class="t lbl" x="208" y="163" text-anchor="middle">sensing &amp;</text>
<text class="t lbl" x="208" y="178" text-anchor="middle">ground truth</text>
<text class="t sm" x="208" y="192" text-anchor="middle">W1–2</text>

<rect x="290" y="120" width="112" height="78" rx="7" fill="#fbf0e3" stroke="#b4661f" stroke-width="2"/>
<text class="t ttl" x="346" y="144" text-anchor="middle">P2</text>
<text class="t lbl" x="346" y="163" text-anchor="middle">deception</text>
<text class="t lbl" x="346" y="178" text-anchor="middle">surfaces</text>
<text class="t sm" x="346" y="192" text-anchor="middle">W3</text>

<rect x="428" y="120" width="112" height="78" rx="7" fill="#efeaf7" stroke="#6a4b9c" stroke-width="2.6"/>
<text class="t ttl" x="484" y="144" text-anchor="middle">P3</text>
<text class="t lbl" x="484" y="163" text-anchor="middle">interaction</text>
<text class="t lbl" x="484" y="178" text-anchor="middle">&amp; intent</text>
<text class="t sm" x="484" y="192" text-anchor="middle">W4</text>

<rect x="566" y="120" width="112" height="78" rx="7" fill="#e6f4ed" stroke="#2b7d5c" stroke-width="2"/>
<text class="t ttl" x="622" y="144" text-anchor="middle">P4</text>
<text class="t lbl" x="622" y="163" text-anchor="middle">intelligence</text>
<text class="t sm" x="622" y="192" text-anchor="middle">W5–6</text>

<rect x="704" y="120" width="102" height="78" rx="7" fill="#e6f4ed" stroke="#2b7d5c" stroke-width="2"/>
<text class="t ttl" x="755" y="144" text-anchor="middle">P5</text>
<text class="t lbl" x="755" y="163" text-anchor="middle">evaluation</text>
<text class="t sm" x="755" y="192" text-anchor="middle">W7–8</text>

<path class="arw" marker-end="url(#a)" d="M126,159 L146,159"/>
<path class="arw" marker-end="url(#a)" d="M264,159 L284,159"/>
<path class="arw" marker-end="url(#a)" d="M402,159 L422,159"/>
<path class="arw" marker-end="url(#a)" d="M540,159 L560,159"/>
<path class="arw" marker-end="url(#a)" d="M678,159 L698,159"/>

<!-- gates above -->
<text class="t gate" x="208" y="98" text-anchor="middle">A/A must conclude</text>
<text class="t gate" x="208" y="84" text-anchor="middle">before any treatment</text>
<path class="arw" d="M208,102 L208,116" stroke="#a83232"/>

<text class="t gate" x="484" y="98" text-anchor="middle">19-property gate</text>
<text class="t gate" x="484" y="84" text-anchor="middle">— binary, never waived</text>
<path class="arw" d="M484,102 L484,116" stroke="#a83232"/>

<text class="t gate" x="755" y="98" text-anchor="middle">pre-registration</text>
<text class="t gate" x="755" y="84" text-anchor="middle">must precede exposure</text>
<path class="arw" d="M755,102 L755,116" stroke="#a83232"/>

<!-- checkpoints below -->
<g>
  <path d="M208,232 l14,-14 l14,14 l-14,14 z" fill="#b4661f" transform="translate(-14,0)"/>
  <text class="t lbl" x="208" y="266" text-anchor="middle">C1 · end W2</text>
  <text class="t sm" x="208" y="282" text-anchor="middle">A/A clean?</text>
  <path class="arw" d="M208,198 L208,222" stroke="#b4661f"/>
</g>
<g>
  <path d="M346,232 l14,-14 l14,14 l-14,14 z" fill="#b4661f" transform="translate(-14,0)"/>
  <text class="t lbl" x="346" y="266" text-anchor="middle">C2 · end W3</text>
  <text class="t sm" x="346" y="282" text-anchor="middle">gate passes?</text>
  <path class="arw" d="M346,198 L346,222" stroke="#b4661f"/>
</g>
<g>
  <path d="M622,232 l14,-14 l14,14 l-14,14 z" fill="#b4661f" transform="translate(-14,0)"/>
  <text class="t lbl" x="622" y="266" text-anchor="middle">C3 · end W6</text>
  <text class="t sm" x="622" y="282" text-anchor="middle">enough operators?</text>
  <path class="arw" d="M622,198 L622,222" stroke="#b4661f"/>
</g>

<text class="t sm" x="410" y="306" text-anchor="middle">each checkpoint has a fallback agreed in advance, so the decision on the day is a selection rather than an improvisation</text>

<!-- future phases -->
<rect x="290" y="330" width="112" height="52" rx="7" fill="#ffffff" stroke="#98a4b3" stroke-width="1.8" stroke-dasharray="5 4"/>
<text class="t ttl" x="346" y="352" text-anchor="middle" style="fill:#5a6675">P6</text>
<text class="t sm" x="346" y="370" text-anchor="middle">immersive envs</text>

<rect x="428" y="330" width="112" height="52" rx="7" fill="#ffffff" stroke="#98a4b3" stroke-width="1.8" stroke-dasharray="5 4"/>
<text class="t ttl" x="484" y="352" text-anchor="middle" style="fill:#5a6675">P7</text>
<text class="t sm" x="484" y="370" text-anchor="middle">learned policy</text>

<rect x="566" y="330" width="112" height="52" rx="7" fill="#ffffff" stroke="#98a4b3" stroke-width="1.8" stroke-dasharray="5 4"/>
<text class="t ttl" x="622" y="352" text-anchor="middle" style="fill:#5a6675">P8</text>
<text class="t sm" x="622" y="370" text-anchor="middle">thesis &amp; defence</text>

<path class="fut" marker-end="url(#d)" d="M755,198 L755,356 L684,356"/>
<path class="fut" marker-end="url(#d)" d="M402,356 L422,356"/>
<path class="fut" marker-end="url(#d)" d="M540,356 L560,356"/>
<text class="t sm" x="150" y="360" style="fill:#5a6675">beyond milestone 1 — designed here, built later</text>
</svg>
