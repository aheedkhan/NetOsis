name: cybersnare

x-python: &python
  image: localhost/cybersnare-python:lab
  pull_policy: build
  build:
    context: .
    dockerfile: containers/Dockerfile.python

networks:
  mgmt:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.200.1.0/24
          gateway: 10.200.1.1
  deception:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.200.2.0/24
          gateway: 10.200.2.1
  egress:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.200.3.0/24
          gateway: 10.200.3.1

services:
  decision:
    <<: *python
    container_name: cs-decision
    hostname: decision
    command: ["python", "-m", "services.decision"]
    environment:
      CS_BIND: "0.0.0.0"
      CS_PORT: "9000"
      CS_MANIFEST_SEED: "/config/manifest-p0.json"
      CS_MANIFEST_CURRENT: "/data/manifests/current.json"
    volumes:
      - ./config:/config:ro,z
      - ./data/manifests:/data/manifests:z
    networks:
      mgmt:
        ipv4_address: 10.200.1.11
    ports:
      - "127.0.0.1:19000:9000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    restart: unless-stopped

  logger:
    <<: *python
    container_name: cs-logger
    hostname: logger
    command: ["python", "-m", "services.logger"]
    environment:
      CS_BIND: "0.0.0.0"
      CS_PORT: "8088"
      CS_LOG_PATH: "/data/events.jsonl"
      CS_LOG_MAX_BYTES: "104857600"
      CS_DECISION_HOST: "10.200.1.11"
      CS_DECISION_PORT: "9000"
    volumes:
      - ./data/events:/data:z
    networks:
      mgmt:
        ipv4_address: 10.200.1.10
    ports:
      - "127.0.0.1:18088:8088"
    depends_on:
      decision:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    restart: unless-stopped

  sensor:
    image: localhost/cybersnare-zeek:lab
    pull_policy: build
    build:
      context: .
      dockerfile: containers/Dockerfile.zeek
    container_name: cs-sensor
    hostname: sensor
    environment:
      CS_ZEEK_IFACE: eth0
    volumes:
      - ./data/zeek:/zeek/logs:z
    networks:
      deception:
        ipv4_address: 10.200.2.10
      mgmt:
        ipv4_address: 10.200.1.20
    ports:
      - "127.0.0.1:2222:2222"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
    cap_add:
      - NET_RAW
      - NET_ADMIN
    depends_on:
      logger:
        condition: service_healthy
    restart: unless-stopped

  ssh:
    <<: *python
    container_name: cs-ssh
    hostname: ssh-surface
    command: ["python", "-m", "services.ssh_surface"]
    environment:
      CS_BIND: "0.0.0.0"
      CS_PORT: "2222"
      CS_SELF_IP: "10.200.2.10"
      CS_LOGGER_HOST: "10.200.1.10"
      CS_LOGGER_PORT: "8088"
      CS_ARM: "A"
      CS_LEVEL: "L1"
      CS_MANIFEST_ID: "p0-static-v1"
    network_mode: service:sensor
    depends_on:
      logger:
        condition: service_healthy
      sensor:
        condition: service_started
    restart: unless-stopped

  http:
    <<: *python
    container_name: cs-http
    hostname: http-surface
    command: ["python", "-m", "services.http_surface"]
    environment:
      CS_BIND: "0.0.0.0"
      CS_PORT: "8080"
      CS_HTTPS_PORT: "8443"
      CS_SELF_IP: "10.200.2.10"
      CS_LOGGER_HOST: "10.200.1.10"
      CS_LOGGER_PORT: "8088"
      CS_ARM: "A"
      CS_LEVEL: "L1"
      CS_MANIFEST_ID: "p0-static-v1"
    network_mode: service:sensor
    depends_on:
      logger:
        condition: service_healthy
      sensor:
        condition: service_started
    restart: unless-stopped

  zeek_ingest:
    <<: *python
    container_name: cs-zeek-ingest
    hostname: zeek-ingest
    command: ["python", "-m", "services.zeek_ingest"]
    environment:
      CS_ZEEK_LOG_DIR: "/zeek/logs"
      CS_LOGGER_HOST: "10.200.1.10"
      CS_LOGGER_PORT: "8088"
      CS_ARM: "A"
      CS_LEVEL: "L1"
      CS_MANIFEST_ID: "p0-static-v1"
    volumes:
      - ./data/zeek:/zeek/logs:z
    networks:
      mgmt:
        ipv4_address: 10.200.1.23
    depends_on:
      logger:
        condition: service_healthy
      sensor:
        condition: service_started
    restart: unless-stopped


  sinkhole:
    <<: *python
    container_name: cs-sinkhole
    hostname: sinkhole
    command: ["python", "-m", "services.sinkhole"]
    environment:
      CS_BIND: "0.0.0.0"
      CS_HTTP_PORT: "80"
      CS_DNS_PORT: "53"
      CS_SELF_IP: "10.200.3.2"
      CS_LOGGER_HOST: "10.200.1.10"
      CS_LOGGER_PORT: "8088"
      CS_ARM: "A"
      CS_LEVEL: "L1"
      CS_MANIFEST_ID: "p0-static-v1"
    networks:
      egress:
        ipv4_address: 10.200.3.2
      mgmt:
        ipv4_address: 10.200.1.22
    depends_on:
      logger:
        condition: service_healthy
    restart: unless-stopped

  sandbox:
    <<: *python
    container_name: cs-sandbox
    hostname: sandbox
    command: ["sleep", "infinity"]
    user: "65534:65534"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 64m
    pids_limit: 64
    dns:
      - 10.200.3.2
    volumes:
      - ./config/resolv.sandbox:/etc/resolv.conf:ro,z
    networks:
      egress:
        ipv4_address: 10.200.3.10
    depends_on:
      - sinkhole
    restart: unless-stopped
