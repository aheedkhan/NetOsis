# Drop-in for netosis-agent.service (installed to
# /etc/systemd/system/netosis-agent.service.d/seccomp.conf by agent-install.sh,
# kept only if the agent still starts: some containers can't load seccomp filters).
[Service]
RestrictSUIDSGID=true
LockPersonality=true
RestrictRealtime=true
# outbound HTTP to the controller + the local systemd bus for `systemctl is-active`
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
