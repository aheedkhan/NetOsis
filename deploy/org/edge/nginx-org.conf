# Stock server block for the NexusCorp org hosts.
# server_tokens off so the version string is not a free fingerprint — these are
# meant to look like maintained corporate servers, not defaults.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Login endpoints answer the way an appliance does: accept the POST, return
    # a generic failure. Credentials are captured in the access log.
    location = /login {
        return 401 "Authentication failed\n";
    }
    location = /auth {
        return 401 "Authentication failed\n";
    }
}
