# Real NexusCorp public site on cs-edge (not deception — this is the legitimate org front door).
server {
    listen 80;
    listen [::]:80;
    server_name nexuscorp.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nexuscorp.example;

    ssl_certificate     /etc/nginx/ssl/nexuscorp.crt;
    ssl_certificate_key /etc/nginx/ssl/nexuscorp.key;

    root /var/www/nexuscorp;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/health {
        return 200 '{"ok":true,"service":"nexuscorp-public"}\n';
        add_header Content-Type application/json;
    }
}
