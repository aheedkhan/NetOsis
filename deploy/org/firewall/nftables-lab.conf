#!/usr/sbin/nft -f
# cs-lab — internal segmentation. Hypervisor/admin must NOT reach deception VLAN from outside k8s.
# Pod CNI handles east-west; this guards the host boundary.

flush ruleset

table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;

    iif "lo" accept
    ct state established,related accept

    # k3s API, SSH admin, WireGuard from edge only
    iif "eth0" tcp dport { 22, 6443 } accept
    iif "wg0" accept

    # Zeek/tcpdump needs raw on deception bridge — handled by k8s CAP_NET_RAW
    icmp type echo-request limit rate 5/second accept
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
    # k3s CNI manages pod forwarding
    iifname "cni*" accept
    oifname "cni*" accept
    iif "wg0" oifname "cni*" accept
    iifname "cni*" oif "wg0" accept
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}
