#!/usr/sbin/nft -f
# cs-edge — DMZ firewall. Real web public; deception ports DNAT via WireGuard to cs-lab.
# Install: sudo cp nftables-edge.conf /etc/nftables.conf && sudo systemctl enable --now nftables

flush ruleset

table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;

    iif "lo" accept
    ct state established,related accept
    ct state invalid drop

    # Real public services
    tcp dport { 22, 80, 443 } accept
    udp dport 51820 accept

    # Deception exposure (DNAT to lab via wg0 — see nat table)
    tcp dport { 2222, 8080, 8443 } accept

    icmp type echo-request limit rate 5/second accept
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
    iif "wg0" oif "eth0" ct state established,related accept
    iif "eth0" oif "wg0" ct state established,related accept
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}

table ip nat {
  chain prerouting {
    type nat hook prerouting priority dstnat; policy accept;
    # Deception surfaces live on cs-lab; forward through WireGuard
    tcp dport 2222  dnat to 10.250.0.2:2222
    tcp dport 8080  dnat to 10.250.0.2:8080
    tcp dport 8443  dnat to 10.250.0.2:8443
  }

  chain postrouting {
    type nat hook postrouting priority srcnat; policy accept;
    oif "wg0" masquerade
  }
}
