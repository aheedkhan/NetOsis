apiVersion: apps/v1
kind: Deployment
metadata:
  name: gnn-scorer
  namespace: cybersnare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gnn-scorer
  template:
    metadata:
      labels:
        app: gnn-scorer
    spec:
      containers:
        - name: gnn-scorer
          image: localhost/cybersnare-gnn:lab
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "services.gnn_scorer"]
          envFrom:
            - configMapRef:
                name: cybersnare-config
          env:
            - name: CS_BIND
              value: "0.0.0.0"
            - name: CS_PORT
              value: "9100"
          ports:
            - containerPort: 9100
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: "2"
          readinessProbe:
            httpGet:
              path: /health
              port: 9100
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gnn-scorer
  namespace: cybersnare
spec:
  selector:
    app: gnn-scorer
  ports:
    - port: 9100
      targetPort: 9100
