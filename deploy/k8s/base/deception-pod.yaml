# Sensor pod: Zeek + SSH + HTTP share network namespace (same pattern as Podman compose).
apiVersion: v1
kind: Pod
metadata:
  name: deception-sensor
  namespace: cybersnare
  labels:
    app: deception-sensor
spec:
  hostNetwork: false
  containers:
    - name: zeek
      image: localhost/cybersnare-zeek:lab
      imagePullPolicy: IfNotPresent
      securityContext:
        capabilities:
          add: [NET_RAW, NET_ADMIN]
      volumeMounts:
        - name: zeek-logs
          mountPath: /zeek/logs
    - name: ssh-surface
      image: localhost/cybersnare-python:lab
      imagePullPolicy: IfNotPresent
      command: ["python", "-m", "services.ssh_surface"]
      env:
        - name: CS_BIND
          value: "0.0.0.0"
        - name: CS_PORT
          value: "2222"
        - name: CS_LOGGER_HOST
          value: logger.cybersnare.svc.cluster.local
        - name: CS_LOGGER_PORT
          value: "8088"
        - name: CS_SELF_IP
          value: "10.200.2.10"
    - name: http-surface
      image: localhost/cybersnare-python:lab
      imagePullPolicy: IfNotPresent
      command: ["python", "-m", "services.http_surface"]
      env:
        - name: CS_BIND
          value: "0.0.0.0"
        - name: CS_PORT
          value: "8080"
        - name: CS_HTTPS_PORT
          value: "8443"
        - name: CS_LOGGER_HOST
          value: logger.cybersnare.svc.cluster.local
        - name: CS_LOGGER_PORT
          value: "8088"
        - name: CS_SELF_IP
          value: "10.200.2.10"
  volumes:
    - name: zeek-logs
      persistentVolumeClaim:
        claimName: cybersnare-zeek
---
apiVersion: v1
kind: Service
metadata:
  name: deception
  namespace: cybersnare
spec:
  type: NodePort
  selector:
    app: deception-sensor
  ports:
    - name: ssh
      port: 2222
      targetPort: 2222
      nodePort: 30222
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30808
    - name: https
      port: 8443
      targetPort: 8443
      nodePort: 30443
