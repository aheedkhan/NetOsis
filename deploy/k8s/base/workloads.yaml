apiVersion: apps/v1
kind: Deployment
metadata:
  name: zeek-ingest
  namespace: cybersnare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zeek-ingest
  template:
    metadata:
      labels:
        app: zeek-ingest
    spec:
      containers:
        - name: zeek-ingest
          image: localhost/cybersnare-python:lab
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "services.zeek_ingest"]
          env:
            - name: CS_ZEEK_LOG_DIR
              value: /zeek/logs
            - name: CS_LOGGER_HOST
              value: logger.cybersnare.svc.cluster.local
            - name: CS_LOGGER_PORT
              value: "8088"
          volumeMounts:
            - name: zeek-logs
              mountPath: /zeek/logs
      volumes:
        - name: zeek-logs
          persistentVolumeClaim:
            claimName: cybersnare-zeek
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sinkhole
  namespace: cybersnare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sinkhole
  template:
    metadata:
      labels:
        app: sinkhole
    spec:
      containers:
        - name: sinkhole
          image: localhost/cybersnare-python:lab
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "services.sinkhole"]
          env:
            - name: CS_LOGGER_HOST
              value: logger.cybersnare.svc.cluster.local
            - name: CS_LOGGER_PORT
              value: "8088"
            - name: CS_SELF_IP
              value: "10.200.3.2"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox
  namespace: cybersnare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox
  template:
    metadata:
      labels:
        app: sandbox
    spec:
      containers:
        - name: sandbox
          image: localhost/cybersnare-python:lab
          imagePullPolicy: IfNotPresent
          command: ["sleep", "infinity"]
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
# Real internal services (low-value realism — not deception)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-mirror
  namespace: cybersnare
  labels:
    cybersnare.io/service-type: real
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitlab-mirror
  template:
    metadata:
      labels:
        app: gitlab-mirror
        cybersnare.io/service-type: real
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: html
          configMap:
            name: gitlab-mirror-html
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitlab-mirror-html
  namespace: cybersnare
data:
  index.html: |
    <!DOCTYPE html><html><head><title>GitLab</title></head>
    <body><h1>NexusCorp GitLab Mirror</h1><p>Internal CI — real service, no secrets.</p></body></html>
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab-mirror
  namespace: cybersnare
spec:
  selector:
    app: gitlab-mirror
  ports:
    - port: 80
