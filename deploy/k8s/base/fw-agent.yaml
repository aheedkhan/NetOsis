# k8s-native firewall agent — the decision plane's blocking mechanism for the
# Kubernetes deployment. See services/k8s_fw_agent for what it does and why it
# differs from the compose deployment's nftables-set approach.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fw-agent
  namespace: cs-control
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cs-fw-agent
rules:
  - apiGroups: ["cilium.io"]
    resources: ["ciliumclusterwidenetworkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cs-fw-agent
subjects:
  - kind: ServiceAccount
    name: fw-agent
    namespace: cs-control
roleRef:
  kind: ClusterRole
  name: cs-fw-agent
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fw-agent-state
  namespace: cs-control
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fw-agent
  namespace: cs-control
spec:
  replicas: 1
  selector:
    matchLabels: {app: fw-agent}
  template:
    metadata:
      labels: {app: fw-agent}
    spec:
      serviceAccountName: fw-agent
      containers:
        - name: fw-agent
          image: localhost/cybersnare-fw-agent-k8s:lab
          imagePullPolicy: IfNotPresent
          env:
            - {name: CS_BIND, value: "0.0.0.0"}
            - {name: CS_PORT, value: "9400"}
            - {name: CS_FW_STATE, value: "/data/blocked.json"}
          ports: [{containerPort: 9400}]
          volumeMounts: [{name: state, mountPath: /data}]
          readinessProbe:
            httpGet: {path: /health, port: 9400}
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: state
          persistentVolumeClaim: {claimName: fw-agent-state}
---
apiVersion: v1
kind: Service
metadata:
  name: fw-agent
  namespace: cs-control
spec:
  selector: {app: fw-agent}
  ports: [{port: 9400, targetPort: 9400}]
