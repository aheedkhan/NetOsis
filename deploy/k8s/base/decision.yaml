apiVersion: apps/v1
kind: Deployment
metadata:
  name: decision
  namespace: cybersnare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: decision
  template:
    metadata:
      labels:
        app: decision
    spec:
      containers:
        - name: decision
          image: localhost/cybersnare-python:lab
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "services.decision"]
          envFrom:
            - configMapRef:
                name: cybersnare-config
          env:
            - name: CS_BIND
              value: "0.0.0.0"
            - name: CS_PORT
              value: "9000"
            - name: CS_CONFIG_DIR
              value: "/config"
            - name: CS_MANIFEST_CURRENT
              value: "/data/manifests/current.json"
          ports:
            - containerPort: 9000
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: manifests
              mountPath: /data/manifests
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: config
          hostPath:
            path: /opt/cybersnare/config
            type: Directory
        - name: manifests
          persistentVolumeClaim:
            claimName: cybersnare-manifests
---
apiVersion: v1
kind: Service
metadata:
  name: decision
  namespace: cybersnare
spec:
  selector:
    app: decision
  ports:
    - port: 9000
      targetPort: 9000
