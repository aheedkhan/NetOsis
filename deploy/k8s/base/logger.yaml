apiVersion: apps/v1
kind: Deployment
metadata:
  name: logger
  namespace: cybersnare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logger
  template:
    metadata:
      labels:
        app: logger
    spec:
      containers:
        - name: logger
          image: localhost/cybersnare-python:lab
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "services.logger"]
          env:
            - name: CS_BIND
              value: "0.0.0.0"
            - name: CS_PORT
              value: "8088"
            - name: CS_LOG_PATH
              value: "/data/events.jsonl"
            - name: CS_DECISION_HOST
              value: decision.cybersnare.svc.cluster.local
            - name: CS_DECISION_PORT
              value: "9000"
          ports:
            - containerPort: 8088
          volumeMounts:
            - name: events
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 8088
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: events
          persistentVolumeClaim:
            claimName: cybersnare-events
---
apiVersion: v1
kind: Service
metadata:
  name: logger
  namespace: cybersnare
spec:
  selector:
    app: logger
  ports:
    - port: 8088
      targetPort: 8088
