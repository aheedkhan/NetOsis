# Authoritative FYP network model (locked).
# Gateways use .254 on /24 networks.
#
# Per-VLAN IP blocks:
#   .1  – .30  = honeypots (HHP) — LXC
#   .31 – .99  = real static (servers / admin) — VMs
#   .100 – .200 = DHCP reserved (unused for core nodes)
#   .254       = OPNsense gateway

management:
  subnet: 172.30.226.0/24
  proxmox_ip: 172.30.226.7/24
  gateway: 172.30.226.254
  bridge: vmbr0
  notes: Fake Internet + management fabric. Hosts Proxmox, OPNsense WAN, Kali.

fake_internet:
  bridge: vmbr0
  kali_example_ip: 172.30.226.50
  opnsense_wan_example_ip: 172.30.226.100
  nat:
    - wan_port: 80
      to: 192.168.30.40:80
      role: real_enterprise_web
    - wan_port: 22
      to: 192.168.30.10:2222
      role: enterprise_ssh_hhp
  notes: See ops/opnsense/PROPOSED_WAN_NAT.md — apply only with user approval.

management_jumpbox:
  ip: 172.30.227.1
  access: OpenVPN then FreeRDP — Proxmox/OPNsense admin only
  notes: NOT the Enterprise jumpbox. Invisible to FYP VLANs.

fyp:
  bridge: vmbr1
  trunk_vlans: [10, 20, 30, 40]
  existing_vlan: 250
  sdn:
    zone: fypzone
    zone_type: vlan
    ipam: pve
    node: vhos
    vnets:
      - name: FIN
        vlan_tag: 10
      - name: OPS
        vlan_tag: 20
      - name: ENT
        vlan_tag: 30
      - name: SOC
        vlan_tag: 40
  ip_policy:
    honeypot_range: ".1-.30"
    real_static_range: ".31-.99"
    dhcp_pool: ".100-.200"
    real_range: ".31-.253"
    gateway: ".254"
  dhcp:
    engine: kea
    pools:
      - vlan: 10
        subnet: 192.168.10.0/24
        range: [192.168.10.100, 192.168.10.200]
        gateway: 192.168.10.254
      - vlan: 20
        subnet: 192.168.20.0/24
        range: [192.168.20.100, 192.168.20.200]
        gateway: 192.168.20.254
      - vlan: 30
        subnet: 192.168.30.0/24
        range: [192.168.30.100, 192.168.30.200]
        gateway: 192.168.30.254
      - vlan: 40
        subnet: 192.168.40.0/24
        range: [192.168.40.100, 192.168.40.200]
        gateway: 192.168.40.254
  hh_egress_policy:
    block_to_real_hosts: true
    allow_to_soc: true
  vlans:
    - id: 10
      name: FINANCE
      subnet: 192.168.10.0/24
      gateway: 192.168.10.254
      purpose: Finance real DB/backup server + FIN-HP (no employee desktops)
      sdn_vnet: FIN
      hosts_model: server_and_hhp
    - id: 20
      name: OPERATIONS
      subnet: 192.168.20.0/24
      gateway: 192.168.20.254
      purpose: Ops real ERP/app + OPS-HP (no employee desktops)
      sdn_vnet: OPS
      hosts_model: server_and_hhp
    - id: 30
      name: ENTERPRISE
      subnet: 192.168.30.0/24
      gateway: 192.168.30.254
      purpose: Real web + ENT jump + WEB-HP entry
      sdn_vnet: ENT
      hosts_model: servers_jumpbox_hhp
    - id: 40
      name: SOC
      subnet: 192.168.40.0/24
      gateway: 192.168.40.254
      purpose: NetOsis controller, Ollama/LLM, sandbox API, Wazuh
      sdn_vnet: null
      hosts_model: controller_monitoring

# No employee desktop VMs (FYP decision — RAM for Qwen/Wazuh)
employee_vms: []

# Real infrastructure (VMs)
enterprise_reals:
  - name: ENT-JUMP-01
    role: enterprise_admin_ssh
    vlan: 30
    ip: 192.168.30.31
    form: vm
  - name: ENT-WEB-REAL-01
    role: real_web
    vlan: 30
    ip: 192.168.30.40
    form: vm

finance_reals:
  - name: FINANCE-DB-REAL-01
    role: real_finance_db
    vlan: 10
    ip: 192.168.10.50
    form: vm

ops_reals:
  - name: OPS-APP-REAL-01
    role: real_ops_erp
    vlan: 20
    ip: 192.168.20.50
    form: vm

# Honeypot LXCs (.10)
honeypots:
  - name: ent-web-01
    role: enterprise-web-hhp
    vlan: 30
    ip: 192.168.30.10
    form: lxc
    vmid_hint: 390
    yaml: deception/hosts/enterprise-web.yml
  - name: finance-db-01
    role: finance-db-hhp
    vlan: 10
    ip: 192.168.10.10
    form: lxc
    vmid_hint: 190
    yaml: deception/hosts/finance-db.yml
  - name: ops-app-01
    role: ops-app-hhp
    vlan: 20
    ip: 192.168.20.10
    form: lxc
    vmid_hint: 290
    yaml: deception/hosts/ops-app.yml

soc_services:
  - name: netosis-controller
    vlan: 40
    ip: 192.168.40.31
    form: vm
    vmid_hint: 490
    notes: Ollama + policy + Phase-2 sandbox API :8000
  - name: wazuh
    vlan: 40
    ip: 192.168.40.40
    form: vm
    notes: Optional SIEM
