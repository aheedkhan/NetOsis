# Observation overlay — the gate off, everything recorded.
#
# Used to collect a training corpus. With the operator gate active an automated
# actor is dropped at the perimeter within seconds, which is the correct
# production behaviour and useless for collecting data: every profile after the
# first never reaches a surface. Corpus collection therefore runs in observe
# mode, which is also the methodologically correct order — the model is trained
# on what arrives, not on what survived a policy the model itself will inform.
services:
  decision:
    environment:
      CS_POLICY: P1
      CS_GNN_ENABLED: "1"
      CS_OPERATOR_GATE: "0"
